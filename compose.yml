services:
  reverse-proxy:
    image: traefik:v3.6
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entryPoints.websecure.address=:443"
      - "--entrypoints.web.address=:80"
      - "--api.insecure=true"
    ports:
      - "20:20" 
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      # So that Traefik can listen to Docker events
      - /var/run/docker.sock:/var/run/docker.sock
        
  portfolio-prod:
    build:
      context: .
      dockerfile: ./Dockerfile
    image: ghcr.io/iataand/portfolio-website:latest
    labels:
      - "traefik.enable=true" 
      - "traefik.http.routers.portfolio-prod.rule=Host(`andrei-iatan.com`)"
      - "traefik.http.routers.portfolio-prod.entrypoints=web"
      - "traefik.http.services.portfolio-prod.loadbalancer.server.port=3000"
    expose:
      - "3000"
    deploy:
      replicas: 3

